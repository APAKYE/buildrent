version: '3.8'

services:
  web:
    image: php:8.2-apache
    container_name: buildrent_web
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html
      - ./app:/var/www/app
      - ./config:/var/www/config
      - ./docker/apache.conf:/etc/apache2/sites-enabled/000-default.conf
    environment:
      - DB_HOST=db
      - DB_NAME=buildrent
      - DB_USER=buildrent_user
      - DB_PASS=buildrent_pass
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "
        docker-php-ext-install pdo pdo_mysql &&
        a2enmod rewrite &&
        apache2-foreground
      "

  db:
    image: mysql:8.0
    container_name: buildrent_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: buildrent
      MYSQL_USER: buildrent_user
      MYSQL_PASSWORD: buildrent_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: buildrent_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: buildrent_user
      PMA_PASSWORD: buildrent_pass
    depends_on:
      - db

volumes:
  db_data:
